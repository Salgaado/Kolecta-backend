services:
  - type: web
    name: kolecta-backend
    env: node
    region: ohio
    plan: free
    # --include=dev força as devDependencies (nest, typescript) mesmo com
    # NODE_ENV=production, senão o `nest build` quebra por falta do @nestjs/cli.
    buildCommand: npm install --include=dev && npx nest build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      # Runtime em produção: desativa o DevAuthMiddleware (mock de auth via
      # header x-dev-user-id). SEM isto = bypass de autenticação em prod.
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
